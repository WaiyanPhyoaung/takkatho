<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Array vs BST: checks to find one value">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc" rx="8"/>
  <text x="400" y="38" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">Array vs BST: checks to find one value</text>
    <text x="400" y="70" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" fill="#64748b" text-anchor="middle" dominant-baseline="middle">Worst case. A balanced BST halves the values left after every check.</text>
  <text x="160" y="108" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">Values (n)</text>
  <text x="400" y="108" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle" dominant-baseline="middle">Array, one by one</text>
  <text x="630" y="108" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#15803d" text-anchor="middle" dominant-baseline="middle">Balanced BST</text>
  <line x1="50" y1="128" x2="750" y2="128" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="50" y="140" width="700" height="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <text x="160" y="158.0" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">100</text>
  <text x="400" y="158.0" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle" dominant-baseline="middle">100 checks</text>
  <text x="630" y="158.0" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#15803d" text-anchor="middle" dominant-baseline="middle">7 checks</text>
  <rect x="50" y="184" width="700" height="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <text x="160" y="202.0" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">1,000</text>
  <text x="400" y="202.0" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle" dominant-baseline="middle">1,000 checks</text>
  <text x="630" y="202.0" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#15803d" text-anchor="middle" dominant-baseline="middle">10 checks</text>
  <rect x="50" y="228" width="700" height="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <text x="160" y="246.0" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">1,000,000</text>
  <text x="400" y="246.0" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle" dominant-baseline="middle">1,000,000 checks</text>
  <text x="630" y="246.0" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#15803d" text-anchor="middle" dominant-baseline="middle">20 checks</text>
  <text x="50" y="290" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" fill="#334155" text-anchor="start" dominant-baseline="middle">Why only 20? Each check cuts the values in half:</text>
  <rect x="50" y="308" width="97" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="6"/>
  <text x="98.5" y="324" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">1,000,000</text>
  <line x1="150" y1="324" x2="166" y2="324" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="171" y="308" width="79" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="6"/>
  <text x="210.5" y="324" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">500,000</text>
  <line x1="253" y1="324" x2="269" y2="324" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="274" y="308" width="79" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="6"/>
  <text x="313.5" y="324" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">250,000</text>
  <line x1="356" y1="324" x2="372" y2="324" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="377" y="308" width="79" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="6"/>
  <text x="416.5" y="324" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">125,000</text>
  <line x1="459" y1="324" x2="475" y2="324" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="480" y="308" width="43" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="6"/>
  <text x="501.5" y="324" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">...</text>
  <line x1="526" y1="324" x2="542" y2="324" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="547" y="308" width="32" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="6"/>
  <text x="563.0" y="324" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">8</text>
  <line x1="582" y1="324" x2="598" y2="324" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="603" y="308" width="32" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="6"/>
  <text x="619.0" y="324" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">4</text>
  <line x1="638" y1="324" x2="654" y2="324" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="659" y="308" width="32" height="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="6"/>
  <text x="675.0" y="324" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">2</text>
  <line x1="694" y1="324" x2="710" y2="324" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="715" y="308" width="32" height="32" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" rx="6"/>
  <text x="731.0" y="324" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#15803d" text-anchor="middle" dominant-baseline="middle">1</text>
  <text x="50" y="366" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#15803d" text-anchor="start" dominant-baseline="middle">20 halvings take 1,000,000 values down to 1, so 20 checks are enough.</text>
</svg>
